<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Lady Gaga</title>
      <style>
        :root {
            --bg-color: #0b0c10;
            --card-back: linear-gradient(135deg, #1f2833 0%, #2c3e50 100%);
            --card-front: #1f2833;
            --accent-pink: #ff007f;
            --accent-blue: #00f0ff;
            --success-green: #2ecc71;
            --error-red: #ff3838;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(255, 0, 127, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(0, 240, 255, 0.12) 0px, transparent 50%);
            margin: 0;
            padding: 20px;
            color: var(--text-light);
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0 5px 0;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #85929E;
            margin-bottom: 20px;
        }

        .score-board {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .score-board span {
            color: var(--accent-blue);
            font-weight: 800;
        }

        #erros {
            color: #ff6b6b;
        }

        .jogo {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 15px;
            perspective: 1000px;
        }

        @media (max-width: 680px) {
            .jogo {
                grid-template-columns: repeat(4, 85px);
                gap: 8px;
            }
            .card {
                height: 85px !important;
                font-size: 11px !important;
            }
            h1 { font-size: 1.8rem; }
        }

        .card {
            width: 100%;
            height: 110px;
            background: var(--card-back);
            color: transparent; /* Esconde o texto por padrão no verso */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s, border 0.3s, color 0.1s;
        }

        .card::before {
            content: "LG";
            position: absolute;
            font-family: 'Impact', sans-serif;
            font-size: 24px;
            color: var(--accent-pink);
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
            border-color: rgba(255, 0, 127, 0.3);
        }

        .card:hover::before {
            opacity: 0.6;
            text-shadow: 0 0 10px var(--accent-pink);
        }

        /* Estado Virado / Revelado */
        .card.flipped {
            background: var(--card-front);
            color: var(--text-light);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: rotateY(180deg) scale(-1, 1); /* Corrige a inversão do texto horizontal */
        }

        .card.flipped::before {
            display: none; /* Some a logo "LG" ao revelar */
        }

        /* Estado Combinado (Acerto) */
        .card.matched {
            background: linear-gradient(135deg, #1f2833 0%, #145a32 100%);
            color: var(--text-light);
            border-color: var(--success-green);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            transform: rotateY(180deg) scale(-1, 1); /* Mantém o texto correto no acerto */
        }

        .card.matched::before {
            display: none;
        }

        /* Estado de Erro */
        .card.wrong {
            background: linear-gradient(135deg, #1f2833 0%, #7b241c 100%) !important;
            color: var(--text-light);
            border-color: var(--error-red);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
            animation: shake 0.4s ease-in-out;
            transform: rotateY(180deg) scale(-1, 1); /* Mantém o texto correto durante o erro */
        }

        .card.wrong::before {
            display: none;
        }

        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) scale(-1, 1) translateX(0); }
            25% { transform: rotateY(180deg) scale(-1, 1) translateX(-6px); }
            75% { transform: rotateY(180deg) scale(-1, 1) translateX(6px); }
        }

        /* Tela de Finalização Customizada */
        .tela-final {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        .tela-final h2 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--success-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .tela-final p {
            font-size: 1.2rem;
            color: #a6acaf;
            margin: 8px 0;
        }

        .btn-reiniciar {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
        }

        .btn-reiniciar:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.5);
        }
    </style>


</head>
<body>
    <h1>Jogo da Memória</h1>
    <h2>tema: Lady Gaga</h2>

    <!-- Placar Dinâmico -->
    <div class="score-board">
        Acertos: <span id="acertos">0</span>/10 | Erros: <span id="erros">0</span>
    </div>

    <div class="jogo"></div>

    <!-- Tela de Finalização Customizada -->
    <div class="tela-final" id="telaFinal">
        <h2>Parabéns! Você Venceu!</h2>
        <p>Você completou o quiz sobre a Lady Gaga.</p>
        <p>Total de Erros: <span id="errosFinais">0</span></p>
        <button class="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
    </div>

    <script>
        const words = [
            { text: 'teenage', pairId: 1 },
            { text: 'adolescente', pairId: 1 },
            { text: 'early', pairId: 2 },
            { text: 'cedo', pairId: 2 },
            { text: 'achieved', pairId: 3 },
            { text: 'conquistou', pairId: 3 },
            { text: 'school tisch', pairId: 4 },
            { text: 'escola tisch', pairId: 4 },
            { text: 'onstage', pairId: 5 },
            { text: 'no palco', pairId: 5 },
            { text: 'convent', pairId: 6 },
            { text: 'convento', pairId: 6 },
            { text: 'neighborhood manhattan', pairId: 7 },
            { text: 'bairro manhattan', pairId: 7 },
            { text: 'sacred', pairId: 8 },
            { text: 'sagrado', pairId: 8 },
            { text: 'flamboyant', pairId: 9 },
            { text: 'extravagante', pairId: 9 },
            { text: 'enormous', pairId: 10 },
            { text: 'enorme', pairId: 10 }
        ];

        let gameBoard = document.querySelector('.jogo');
        let flippedCards = [];
        let matchedPairs = 0;
        let totalErrors = 0;

        function iniciarTabuleiro() {
            gameBoard.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            totalErrors = 0;
            
            // Atualiza os contadores na tela
            document.getElementById('acertos').innerText = '0';
            document.getElementById('erros').innerText = '0';
            document.getElementById('telaFinal').style.display = 'none';

            // Embaralhar as cartas
            words.sort(() => Math.random() - 0.5);

            // Criar o tabuleiro dinamicamente
            words.forEach((item) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.text = item.text;
                card.dataset.pairId = item.pairId;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped') && !this.classList.contains('matched') && !this.classList.contains('wrong')) {
                this.classList.add('flipped');
                this.innerText = this.dataset.text;
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.pairId === card2.dataset.pairId) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('acertos').innerText = matchedPairs;
                flippedCards = [];

                if (matchedPairs === words.length / 2) {
                    setTimeout(() => {
                        document.getElementById('errosFinais').innerText = totalErrors;
                        document.getElementById('telaFinal').style.display = 'flex';
                    }, 500);
                }
            } else {
                totalErrors++;
                document.getElementById('erros').innerText = totalErrors;

                // Aplica a classe vermelha de erro imediatamente
                card1.classList.add('wrong');
                card2.classList.add('wrong');

                // Aguarda 800ms com o bloco vermelho visível antes de desvirar
                setTimeout(() => {
                    card1.classList.remove('flipped', 'wrong');
                    card2.classList.remove('flipped', 'wrong');
                    card1.innerText = '';
                    card2.innerText = '';
                    flippedCards = [];
                }, 800);
            }
        }

        function reiniciarJogo() {
            iniciarTabuleiro();
        }

        // Inicia o jogo automaticamente ao carregar a página
        iniciarTabuleiro();
    </script>
</body>
</html>
